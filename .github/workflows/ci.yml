name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Full install, scripts included.
      #
      # This previously used --ignore-scripts to skip Electron's binary
      # download and the postinstall electron-rebuild, on the reasoning that
      # neither tsc nor the tests need the native module. That was wrong once
      # the tests became real: the suites import modules that reach `electron`
      # transitively (database/connection uses app.getPath), so vitest failed
      # with "Electron failed to install correctly" while passing locally,
      # where the binary is present. Correctness beats the minute it saves.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run lint

      # Currently a stub that exits 0. Wired up now so the job starts
      # failing the moment a real runner lands (see plan P4.5 — vitest,
      # 65 existing cases in paperValueChainService.test.ts).
      - name: Test
        run: npm test
